# Nginx config cho Lynx AI Landing Page (lynxsolution.vn)
# App chạy: Next.js qua PM2 (lynx-landing) port 5012
# SSL: sudo certbot --nginx -d lynxsolution.vn -d www.lynxsolution.vn

server {
    server_name lynxsolution.vn www.lynxsolution.vn;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}

